{% extends 'base.html' %}

{% block title %}Edit Listing - NittanyAuction{% endblock %}

{% block content %}

<h2 style="color: #0f2044; margin-bottom: 4px;">Edit Listing</h2>
<p style="color: #9aa5be; font-size: 13px; margin-bottom: 24px;">Logged in as {{ email }}</p>

<div style="max-width: 640px;">
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <div class="card">
        <form action="{{ url_for('edit_listing', listing_id=listing['listing_ID']) }}" method="post">

            <div class="form-group">
                <label class="form-label">Auction Title</label>
                <input type="text" name="auction_title" class="form-control" value="{{ listing['auction_title'] }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Product Name</label>
                <input type="text" name="product_name" class="form-control" value="{{ listing['product_name'] }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Product Description</label>
                <textarea name="product_description" class="form-control" required>{{ listing['product_description'] }}</textarea>
            </div>

            <div class="form-row-3">
                <div class="form-group">
                    <label class="form-label">Quantity</label>
                    <input type="number" name="quantity" class="form-control" value="{{ listing['quantity'] }}" min="1" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Reserve Price ($)</label>
                    <input type="number" name="reserve_price" class="form-control" value="{{ listing['reserve_price'] }}" min="0" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Max Bids</label>
                    <input type="number" name="max_bids" class="form-control" value="{{ listing['max_bids'] }}" min="1" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/seller" class="btn btn-outline" style="margin-left: 8px;">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
